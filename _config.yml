title: .me
description: Own your knowledge graph.
url: https://neurons-me.github.io
baseurl: "/.me"
image: "https://neurons-me.github.io/docs/assets/img/me.png"
logo: "https://neurons-me.github.io/docs/assets/img/me.png"

remote_theme: neurons-me/neurons-me

plugins:
  - jekyll-remote-theme

exclude:
  - Python/src
  - Python/__pycache__
  - Rust/src
  - Rust/target
  - node_modules
  - "*/node_modules"
  - vendor
  - Typescript/node_modules
  - Typescript/dist
  - Typescript/src
  - Typescript/x.test
  - Typescript/bench.ts
  - Typescript/reports

markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
  hard_wrap: false

defaults:
  - scope:
      path: "Rust"
      type: "pages"
    values:
      layout: readme
      image: "https://neurons-me.github.io/docs/assets/img/me.png"

me_theme:
  brand: .me
  favicon: "https://res.cloudinary.com/dkwnxf6gm/image/upload/v1760629064/neurons.me_b50f6a.png?v=brain"   # same neurons brain as https://neurons-me.github.io/ (?v= cache-bust)
  social_image: "https://neurons-me.github.io/docs/assets/img/me.png"
  nav:   # no Docs / Github items: the topbars carry neither (logo, me:// path, search, theme, gear)
    - label: All.This
      url: https://neurons-me.github.io/all.this/
